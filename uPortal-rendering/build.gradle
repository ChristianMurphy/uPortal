description = "Apereo uPortal Rendering"

dependencies {
    api project(':uPortal-marketplace')
    api project(':uPortal-security:uPortal-security-core')
    api project(':uPortal-url')
    // JAXB at uPortal's version, in place of the older one that Pluto's container brings (excluded
    // below); uPortal-api-search used to provide it
    api "javax.xml.bind:jaxb-api:${jaxbApiVersion}"

    implementation "org.apache.httpcomponents:httpcore:${httpcomponentsVersion}"
    implementation "org.apache.commons:commons-pool2:${commonsPoolVersion}"
    api(project(':uPortal-pluto:uPortal-pluto-container')) {
        exclude group: 'javax.xml.bind', module: 'jaxb-api'
        exclude group: 'com.sun.xml.bind', module: 'jaxb-impl'
        exclude group: 'stax', module: 'stax'
    }
    api project(':uPortal-pluto:uPortal-pluto-portal-driver')

    testImplementation project(':uPortal-pluto:uPortal-pluto-container-api')
    testImplementation project(':uPortal-pluto:uPortal-pluto-portlet-api')
    testImplementation "${servletApiDependency}"

    compileOnly "javax.ccpp:ccpp:${ccppVersion}"
    compileOnly project(':uPortal-pluto:uPortal-pluto-container-driver-api')
    compileOnly project(':uPortal-pluto:uPortal-pluto-portlet-api')
    compileOnly "${servletApiDependency}"
}

// EventProviderImplTest mocks Pluto's PortletContextService
dependencies {
    testImplementation project(':uPortal-pluto:uPortal-pluto-container-driver-api')
}
