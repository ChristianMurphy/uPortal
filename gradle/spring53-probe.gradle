/*
 * Spring 5.3 compile probe (WS6, plan step P4-1).
 *
 * Compiles every module's main and test sources against the Spring 5.3 bloc (Spring Framework,
 * Spring Security, Web Flow, Session and LDAP at the probe* versions in gradle.properties),
 * while everything else, including the other uPortal modules, stays as the regular build
 * compiled it. Each module is therefore measured on its own: an error in one module doesn't
 * hide the errors of the modules that depend on it.
 *
 *   ./gradlew spring53Probe                  report the errors, fail if a module has more
 *                                            than config/spring53-probe/baseline.properties
 *   ./gradlew spring53Probe -PupdateBaseline rewrite the baseline from this run
 *
 * The report is written to build/reports/spring53-probe/ and, on GitHub Actions, to the job
 * summary. The probe never changes what the regular build produces.
 */

import javax.tools.Diagnostic
import javax.tools.DiagnosticCollector
import javax.tools.JavaFileObject
import javax.tools.ToolProvider

def probeVersions = [
        'org.springframework'         : probeSpringVersion,
        'org.springframework.security': probeSpringSecurityVersion,
        'org.springframework.webflow' : probeSpringWebflowVersion,
        'org.springframework.session' : probeSpringSessionVersion,
        'org.springframework.ldap'    : probeSpringLdapVersion,
]
def probeReportDir = rootProject.layout.buildDirectory.dir('reports/spring53-probe')
def probeBaseline = rootProject.file('config/spring53-probe/baseline.properties')

/** Compiles one source set against a probe classpath and records the errors. */
abstract class Spring53ProbeCompile extends DefaultTask {
    @InputFiles
    abstract ConfigurableFileCollection getSources()

    @Classpath
    abstract ConfigurableFileCollection getClasspath()

    @OutputFile
    abstract RegularFileProperty getReport()

    @Internal
    abstract DirectoryProperty getScratch()

    @Internal
    abstract Property<String> getRootPath()

    @TaskAction
    void compile() {
        def files = sources.asFileTree.matching { include '**/*.java' }.files.sort()
        def out = report.get().asFile
        out.parentFile.mkdirs()
        if (files.isEmpty()) {
            out.text = ''
            return
        }
        def classes = scratch.get().asFile
        classes.deleteDir()
        classes.mkdirs()

        def compiler = ToolProvider.getSystemJavaCompiler()
        def diagnostics = new DiagnosticCollector<JavaFileObject>()
        def fileManager = compiler.getStandardFileManager(diagnostics, null, null)
        def options = ['--release', '11', '-proc:none', '-parameters', '-encoding', 'UTF-8',
                       '-nowarn', '-Xmaxerrs', '100000', '-implicit:none',
                       '-d', classes.path, '-classpath', classpath.asPath]
        compiler.getTask(null, fileManager, diagnostics, options, null,
                fileManager.getJavaFileObjectsFromFiles(files)).call()
        fileManager.close()

        def root = new File(rootPath.get()).toPath()
        def lines = diagnostics.diagnostics.findAll { it.kind == Diagnostic.Kind.ERROR }.collect { d ->
            def path = d.source == null ? '?' : root.relativize(new File(d.source.toUri()).toPath()).toString()
            "${path.replace('\\', '/')}:${d.lineNumber}: ${d.getMessage(Locale.ROOT).readLines().find() ?: ''}"
        }
        out.text = lines.join('\n') + (lines ? '\n' : '')
        logger.lifecycle("${path}: ${lines.size()} error(s)")
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        // The copy tool is a Spring Boot 4 application with no uPortal dependencies
        if (project.name == 'uPortal-db-migrate') {
            return
        }
        def probeTasks = []
        ['main', 'test'].each { setName ->
            def sourceSet = sourceSets[setName]
            def regular = configurations[sourceSet.compileClasspathConfigurationName]
            def probe = configurations.create("spring53Probe${setName.capitalize()}CompileClasspath") {
                canBeConsumed = false
                canBeResolved = true
                // The declarable configurations (implementation, compileOnly, ...) behind the
                // regular compile classpath
                extendsFrom(regular.extendsFrom as Configuration[])
                regular.attributes.keySet().each { key ->
                    attributes.attribute(key, regular.attributes.getAttribute(key))
                }
                resolutionStrategy.eachDependency { details ->
                    def version = probeVersions[details.requested.group]
                    if (version != null) {
                        details.useVersion version
                        details.because 'Spring 5.3 compile probe'
                    }
                }
            }
            def task = tasks.register("spring53Probe${setName.capitalize()}", Spring53ProbeCompile) {
                group = 'verification'
                description = "Compiles the ${setName} sources against Spring 5.3 and reports the errors."
                // Generated sources and the other modules' classes come from the regular build
                dependsOn sourceSet.compileJavaTaskName
                sources.from(sourceSet.java.srcDirs, sourceSet.output.generatedSourcesDirs)
                classpath.from(probe)
                if (setName == 'test') {
                    classpath.from(sourceSets.main.output)
                }
                report.set(probeReportDir.map { it.file("${project.path.substring(1).replace(':', '/')}/${setName}.txt") })
                scratch.set(project.layout.buildDirectory.dir("tmp/spring53Probe/${setName}"))
                rootPath.set(project.rootDir.path)
            }
            probeTasks << task
        }
        tasks.register('spring53Probe') {
            group = 'verification'
            description = 'Compiles main and test sources against Spring 5.3 and reports the errors.'
            dependsOn probeTasks
        }
    }
}

tasks.register('spring53Probe') {
    group = 'verification'
    description = 'Compiles every module against Spring 5.3 and compares the error counts with the baseline.'
    def updateBaseline = project.hasProperty('updateBaseline')
    def reportDir = probeReportDir
    def baselineFile = probeBaseline
    def summaryPath = System.getenv('GITHUB_STEP_SUMMARY')
    def versions = probeVersions
    dependsOn subprojects.collect { sub -> sub.tasks.matching { it.name == 'spring53Probe' } }
    doLast {
        def dir = reportDir.get().asFile
        def counts = new TreeMap<String, Integer>()
        def errorLines = new TreeMap<String, List<String>>()
        dir.eachFileRecurse { file ->
            // <module path>/main.txt and test.txt; errors.txt sits at the top
            if (file.name.endsWith('.txt') && file.parentFile != dir) {
                def module = dir.toPath().relativize(file.parentFile.toPath()).toString().replace('\\', '/')
                def lines = file.readLines().findAll { it }
                counts[module] = (counts[module] ?: 0) + lines.size()
                errorLines.computeIfAbsent(module) { [] }.addAll(lines)
            }
        }
        def baseline = new Properties()
        if (baselineFile.exists()) {
            baselineFile.withInputStream { baseline.load(it) }
        }
        def total = counts.values().sum(0)
        def baselineTotal = baseline.values().collect { it as int }.sum(0)
        def regressions = counts.findAll { module, count ->
            count > (baseline.getProperty(module, '0') as int)
        }

        def md = new StringBuilder()
        md << "## Spring 5.3 compile probe\n\n"
        md << "Compiled against ${versions.collect { g, v -> "`${g}:${v}`" }.join(', ')}.\n\n"
        md << "**${total} error(s)** (baseline ${baselineTotal}).\n\n"
        md << "| Module | Errors | Baseline |\n| --- | ---: | ---: |\n"
        (counts.keySet() + baseline.stringPropertyNames()).toSorted().unique().each { module ->
            def count = counts[module] ?: 0
            def base = baseline.getProperty(module, '0') as int
            if (count || base) {
                md << "| ${module} | ${count} | ${base} |\n"
            }
        }
        def byFile = new TreeMap<String, Integer>()
        errorLines.values().flatten().each { line ->
            def file = line.substring(0, line.indexOf(':'))
            byFile[file] = (byFile[file] ?: 0) + 1
        }
        if (byFile) {
            md << "\n<details><summary>Errors by file (${byFile.size()} files)</summary>\n\n"
            md << "| File | Errors |\n| --- | ---: |\n"
            byFile.each { file, count -> md << "| `${file}` | ${count} |\n" }
            md << "\n</details>\n"
        }
        new File(dir, 'summary.md').text = md.toString()
        new File(dir, 'errors.txt').text = errorLines.collect { m, lines -> lines.join('\n') }.join('\n') + '\n'
        if (summaryPath) {
            new File(summaryPath).append(md.toString())
        }
        logger.lifecycle(md.toString())

        if (updateBaseline) {
            baselineFile.parentFile.mkdirs()
            baselineFile.text = "# Errors per module when compiling against the Spring 5.3 bloc (P4-1).\n" +
                    "# Written by ./gradlew spring53Probe -PupdateBaseline; the counts may only go down.\n" +
                    counts.findAll { it.value > 0 }.collect { m, c -> "${m}=${c}" }.join('\n') + '\n'
            logger.lifecycle("Wrote ${baselineFile}")
        } else if (!baselineFile.exists()) {
            logger.warn("Spring 5.3 probe: no ${baselineFile}; record one with -PupdateBaseline")
        } else if (regressions) {
            throw new GradleException("Spring 5.3 probe: more errors than the baseline in " +
                    regressions.collect { m, c -> "${m} (${c} > ${baseline.getProperty(m, '0')})" }.join(', ') +
                    ". See build/reports/spring53-probe/errors.txt.")
        } else if (total < baselineTotal) {
            logger.lifecycle("Spring 5.3 probe: ${baselineTotal - total} fewer error(s) than the baseline; " +
                    "lower it with ./gradlew spring53Probe -PupdateBaseline")
        }
    }
}
