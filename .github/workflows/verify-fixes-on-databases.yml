name: Verify fixes on databases
#
# Runs the tests of three fix branches on real databases, first without the fix and then with it:
#
#   fix/structure-id-race             RDBMUserLayoutStoreStructIdTest
#   fix/counter-store-read-committed  CounterStoreTest
#   fix/layout-save-overlap           RDBMUserLayoutStoreConcurrencyTest, UserLayoutHelperImplTest
#
# Those tests build an HSQLDB database of their own. The patches in .github/verify/patches give
# them the job's database through the verify.jdbc.* system properties, and
# .github/verify/verify.init.gradle adds the JDBC drivers. Neither is part of a fix branch.
# .github/verify/run.sh says what "without the fix" means. Connections keep the isolation level
# each database gives them by default, as the portal's do.
#
# A job fails only if a test fails with the fix, or if a state ran no test. A test that fails
# without the fix is the expected result where the bug shows. The table in each job's summary says
# what every test did.
#
# Credentials are throwaway values for the job's own service container.
#
on:
  push:
    branches:
      - test/verify-fixes-on-databases
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: "Verify fixes: ${{ matrix.vendor }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: postgres-16
            image: postgres:16
            port: 5432
            health: pg_isready -h 127.0.0.1 -U uportal -d uportal
            driver: org.postgresql.Driver
            url: jdbc:postgresql://localhost:5432/uportal
            username: uportal
            password: uportal
          - vendor: postgres-18
            image: postgres:18
            port: 5432
            health: pg_isready -h 127.0.0.1 -U uportal -d uportal
            driver: org.postgresql.Driver
            url: jdbc:postgresql://localhost:5432/uportal
            username: uportal
            password: uportal
          - vendor: mariadb-12.3
            image: mariadb:12.3
            port: 3306
            health: mariadb-admin ping -h 127.0.0.1 -u uportal -puportal
            driver: org.mariadb.jdbc.Driver
            # Hibernate 4.3 has no dialect for the product name "MariaDB"
            url: jdbc:mariadb://localhost:3306/uportal?useMysqlMetadata=true
            username: uportal
            password: uportal
          - vendor: mysql-8.4
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -u uportal -puportal
            driver: com.mysql.cj.jdbc.Driver
            url: jdbc:mysql://localhost:3306/uportal?useSSL=false&allowPublicKeyRetrieval=true
            username: uportal
            password: uportal
          - vendor: sqlserver-2025
            image: mcr.microsoft.com/mssql/server:2025-latest
            port: 1433
            health: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P uPortal-Harness-1 -Q 'SELECT 1'
            driver: com.microsoft.sqlserver.jdbc.SQLServerDriver
            url: jdbc:sqlserver://localhost:1433;databaseName=uportal;encrypt=false
            username: sa
            password: uPortal-Harness-1
          - vendor: oracle-23
            image: gvenzl/oracle-free:23-slim
            port: 1521
            health: healthcheck.sh
            driver: oracle.jdbc.OracleDriver
            url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
            username: uportal
            password: uportal
    services:
      db:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        # One environment for every image; each image reads only its own variables.
        env:
          POSTGRES_DB: uportal
          POSTGRES_USER: uportal
          POSTGRES_PASSWORD: uportal
          MARIADB_DATABASE: uportal
          MARIADB_USER: uportal
          MARIADB_PASSWORD: uportal
          MARIADB_ROOT_PASSWORD: uportal-root
          MYSQL_DATABASE: uportal
          MYSQL_USER: uportal
          MYSQL_PASSWORD: uportal
          MYSQL_ROOT_PASSWORD: uportal-root
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: uPortal-Harness-1
          ORACLE_PASSWORD: uportal-sys
          APP_USER: uportal
          APP_USER_PASSWORD: uportal
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 10s --health-timeout 10s --health-retries 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the fix branches
        run: >-
          git fetch --no-tags origin
          fix/structure-id-race fix/counter-store-read-committed fix/layout-save-overlap
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Record the database's version and settings
        env:
          DB_CONTAINER: ${{ job.services.db.id }}
          VENDOR: ${{ matrix.vendor }}
        run: |
          docker inspect --format '{{.Config.Image}} {{.Image}}' "$DB_CONTAINER"
          case "$VENDOR" in
            postgres-*)
              docker exec "$DB_CONTAINER" psql -U uportal -d uportal -At \
                -c "SELECT version()" -c "SHOW default_transaction_isolation" ;;
            mariadb-*)
              settings=$(docker exec "$DB_CONTAINER" mariadb -uroot -puportal-root -N \
                -e "SELECT VERSION(), @@transaction_isolation, @@innodb_snapshot_isolation")
              echo "$settings"
              # The bug needs innodb_snapshot_isolation, which MariaDB 11.6 and later turn on
              echo "$settings" | grep -q 'REPEATABLE-READ[[:space:]]*1$' ;;
            mysql-*)
              docker exec "$DB_CONTAINER" mysql -uroot -puportal-root -N \
                -e "SELECT VERSION(), @@transaction_isolation" ;;
            sqlserver-*)
              # The image has no setting that creates a database
              docker exec "$DB_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -S localhost \
                -U sa -P uPortal-Harness-1 \
                -Q "IF DB_ID('uportal') IS NULL CREATE DATABASE uportal; SELECT @@VERSION; SELECT name, is_read_committed_snapshot_on FROM sys.databases WHERE name = 'uportal'" ;;
            oracle-*)
              docker exec "$DB_CONTAINER" bash -c \
                "echo 'SELECT banner_full FROM v\$version;' | sqlplus -S uportal/uportal@//localhost:1521/FREEPDB1" ;;
          esac
      - name: Run the fix branches' tests, without and with each fix
        env:
          VERIFY_DRIVER: ${{ matrix.driver }}
          VERIFY_URL: ${{ matrix.url }}
          VERIFY_USER: ${{ matrix.username }}
          VERIFY_PASSWORD: ${{ matrix.password }}
        run: |
          cp -r .github/verify "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/run.sh" "$RUNNER_TEMP/results"
      - name: Summary
        if: always()
        env:
          VENDOR: ${{ matrix.vendor }}
        run: python3 "$RUNNER_TEMP/verify/summary.py" "$RUNNER_TEMP/results" "$VENDOR"
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.vendor }}
          path: ${{ runner.temp }}/results

  # The same script on the tests' own HSQLDB database, to show that the script gives the results
  # the fix branches were written against
  control:
    name: "Verify fixes: hsqldb (the tests' own database)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the fix branches
        run: >-
          git fetch --no-tags origin
          fix/structure-id-race fix/counter-store-read-committed fix/layout-save-overlap
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run the fix branches' tests, without and with each fix
        run: |
          cp -r .github/verify "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/run.sh" "$RUNNER_TEMP/results"
      - name: Summary
        if: always()
        run: python3 "$RUNNER_TEMP/verify/summary.py" "$RUNNER_TEMP/results" hsqldb
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-hsqldb
          path: ${{ runner.temp }}/results
