name: CI
on:
  push:
    branches:
      - master
      # Prototype only (MOD-I74): run CI on the modernization
      # integration branches. Drop this line before upstreaming.
      - 'ccr-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read
env:
  # Prototype only (MOD-D53): a topic branch (ccr-*) saves its own Gradle cache. setup-gradle
  # writes the cache only on the default branch by default, and none of our work branches is that
  # one, so no job ever saved or restored a cache. Pull requests keep the action's default.
  GRADLE_CACHE_READ_ONLY: ${{ github.event.repository.default_branch != github.ref_name && !startsWith(github.ref_name, 'ccr-') }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Prototype only (MOD-D30): a newer push to a workstream branch (ccr-43ba0785-hzlrj5-<topic>)
  # cancels the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') }}
jobs:
  test:
    name: '${{ matrix.platform }} with Java ${{ matrix.java-distribution }} version ${{ matrix.java-version }}'
    strategy:
      # Prototype only (MOD-D30): a push to a workstream branch (ccr-43ba0785-hzlrj5-<topic>) runs
      # one Linux leg to spare the account's runners. A manual run on a workstream branch (such as
      # a landing check), master, pull requests and the integration branch run the full matrix:
      # ubuntu x temurin/zulu/corretto x 21/25, plus windows and macos on temurin 25.
      matrix: ${{ fromJSON(startsWith(github.ref_name, 'ccr-43ba0785-hzlrj5-') && github.event_name != 'workflow_dispatch' && '{"include":[{"platform":"ubuntu-latest","java-distribution":"temurin","java-version":21}]}' || '{"platform":["ubuntu-latest"],"java-distribution":["temurin","zulu","corretto"],"java-version":[21,25],"include":[{"platform":"windows-latest","java-distribution":"temurin","java-version":25},{"platform":"macos-latest","java-distribution":"temurin","java-version":25}]}') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: ${{ matrix.java-version }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
      - name: Install Chromium for the web component tests
        run: ./gradlew -S --no-daemon :uPortal-webcomponents:installChromium
      - name: Build and Test
        env:
          # Every leg but one prints compile errors only (MOD-D53); Linux with Temurin 21 keeps
          # listing the Error Prone and javac warnings. Gradle reads this as -PquietCompile, in
          # any shell.
          ORG_GRADLE_PROJECT_quietCompile: ${{ !(matrix.platform == 'ubuntu-latest' && matrix.java-distribution == 'temurin' && matrix.java-version == 21) }}
        run: ./gradlew -S --stacktrace --no-daemon --no-parallel build jacocoAggregateReport
      - name: Upload coverage to Coveralls
        if: ${{ matrix.platform == 'ubuntu-latest' && matrix.java-distribution == 'temurin' && matrix.java-version == 21 }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: build/reports/jacoco/jacocoAggregateReport/jacocoAggregateReport.xml
          format: jacoco
          fail-on-error: false
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.platform }}-${{ matrix.java-distribution }}-${{ matrix.java-version }}
          path: '**/build/reports/tests/'
      - name: Lint JavaScript
        run: ./gradlew -S --no-daemon --no-parallel :npm_run_lint-js

  static-analysis:
    name: Static analysis (SpotBugs and FindSecBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
      # Fails on any finding that is not in the module's config/spotbugs/baseline file
      # (MOD-D27). --continue analyses every module, so one run lists all new findings.
      - name: Run SpotBugs
        run: ./gradlew -S --no-daemon --continue -PquietCompile spotbugsMain
      - name: Show new findings
        if: failure()
        run: |
          find . -path '*/build/reports/spotbugs/main.txt' -size +0c | sort | while read -r report; do
            echo "::group::${report}"
            cat "${report}"
            echo "::endgroup::"
          done
      - name: Upload SpotBugs reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs-reports
          path: '**/build/reports/spotbugs/'

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find the commits to check
        id: range
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The commits this push or pull request adds; a new branch is checked from the
          # commit that added each script onwards.
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..HEAD"
          elif [ -n "$EVENT_BEFORE" ] && ! [[ "$EVENT_BEFORE" =~ ^0+$ ]] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            range="$EVENT_BEFORE..HEAD"
          else
            range=HEAD
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: Check Conventional Commit subjects
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: .github/scripts/check-commit-messages.sh "$RANGE"
      - name: Check commit messages for AI writing tells (Vale, MOD-D35)
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: .github/scripts/vale.sh commits "$RANGE"
      - name: Check the ArchUnit freeze store did not grow (MOD-D43)
        if: ${{ !cancelled() && steps.range.outcome == 'success' && contains(steps.range.outputs.range, '..') }}
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: .github/scripts/check-freeze-store.py "${RANGE%%..*}"

  prose:
    name: Prose (Vale)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the 6.0 docs for AI writing tells (Vale, MOD-D35)
        # Lints every doc in scope, so a docs-only [skip ci] push is checked by the next run.
        run: .github/scripts/vale.sh docs

  spring53-probe:
    # Measures what plan step P4-1 (Spring 5.3) still has to change; see
    # gradle/spring53-probe.gradle. Fails only if a module gets more errors than its baseline.
    name: Spring 5.3 compile probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}
      # Writes the error counts by module to the job summary
      - name: Compile against Spring 5.3
        run: ./gradlew -S --no-daemon --continue -PquietCompile spring53Probe
      - name: Show the errors
        if: always()
        run: cat build/reports/spring53-probe/errors.txt || true

  dependency-submission:
    name: Submit dependency graph
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to submit the dependency graph
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
