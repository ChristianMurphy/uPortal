description = "Apereo uPortal Core"

dependencies {
    api 'javax.annotation:javax.annotation-api:1.3.2'
    api "commons-lang:commons-lang:${commonsLangVersion}"
    api "org.apache.commons:commons-lang3:${commonsLang3Version}"
    api("org.hibernate:hibernate-core:${hibernateVersion}") {
        // The web application already has a JAXB runtime, com.sun.xml.bind:jaxb-impl (through
        // jaxb2-basics-runtime and Pluto). Hibernate 5.6 asks for org.glassfish.jaxb:jaxb-runtime,
        // which holds the same com.sun.xml.bind classes under another name.
        exclude group: 'org.glassfish.jaxb', module: 'jaxb-runtime'
    }
    // uPortal's XML code is written against dom4j 1.6.1. Hibernate 5.6 doesn't bring a dom4j jar.
    api "dom4j:dom4j:${dom4jVersion}"
    // Hibernate 5.6 builds its lazy-loading proxies with Byte Buddy. The 1.12 it asks for knows
    // class files up to Java 20, and the portal runs on newer JDKs. This is the version the
    // tests already run with, through Mockito.
    runtimeOnly "net.bytebuddy:byte-buddy:${byteBuddyVersion}"
    // For the user types of the fname, nullSafeString, qname, json, stats_json and windowState
    // typedefs, which are built on Jadira's SPI and don't use Joda-Time. Jadira has no Hibernate 6
    // support: see the Jadira SPI row in docs/developer/modernization/notes/java-time-jpa.md
    api "org.jadira.usertype:usertype.spi:${usertypeVersion}"
    implementation "org.slf4j:log4j-over-slf4j:${slf4jVersion}"
    implementation "org.slf4j:jcl-over-slf4j:${slf4jVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.springframework:spring-context:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework.security:spring-security-core:${springSecurityVersion}"

    compileOnly project(':uPortal-pluto:uPortal-pluto-container-api')
    compileOnly project(':uPortal-pluto:uPortal-pluto-portlet-api')
    compileOnly "${servletApiDependency}"

    // JavaTimeColumnStorageTest stores through Hibernate into an in-memory database
    testImplementation "org.hsqldb:hsqldb:${hsqldbVersion}"
    // Hibernate's mapping binder loads JAXB, which the JDK no longer has
    testRuntimeOnly "javax.xml.bind:jaxb-api:${jaxbApiVersion}"
}
