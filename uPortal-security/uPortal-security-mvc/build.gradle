description = "Apereo uPortal Security MVC"

dependencies {
    api project(':uPortal-core')
    api project(':uPortal-events')

    testImplementation "${servletApiDependency}"
    // LoginControllerTest mocks IPortalUrlBuilder, whose methods use javax.portlet and Pluto types
    testImplementation project(':uPortal-pluto:uPortal-pluto-portlet-api')
    testImplementation project(':uPortal-pluto:uPortal-pluto-container-api')

    compileOnly "${servletApiDependency}"
    compileOnly "org.springframework:spring-web:${springVersion}"
    compileOnly "org.springframework:spring-test:${springVersion}"

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}
