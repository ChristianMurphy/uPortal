buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath "org.jasig.resourceserver:resource-server-core:${resourceServerVersion}"
        classpath "javax.xml.bind:jaxb-api:${jaxbApiVersion}"
        classpath 'com.sun.xml.bind:jaxb-xjc:2.3.9'
        classpath 'com.sun.xml.bind:jaxb-impl:2.3.9'
    }
    // commons-compress 1.28+ uses commons-lang3.SystemProperties which calls
    // StringUtils.getIfEmpty(CharSequence, Supplier) — added in lang3 3.10.
    // Gradle 6.9.4 bundles lang3 3.7 in its parent classloader, so the call
    // resolves to a method that doesn't exist there. Pin compress to 1.27.x
    // for the buildscript classpath; runtime uses commonsCompressVersion
    // separately and is unaffected.
    configurations.classpath {
        resolutionStrategy {
            force "org.apache.commons:commons-compress:${commonsCompressVersion}"
        }
    }
}

plugins {
    id 'war'
}

apply plugin: 'com.github.node-gradle.node'

description = "Apereo uPortal Webapp (WAR)"

// Spotless scans the project directory which overlaps with the node plugin's
// nodeSetup/npmInstall output directory.  Declare ordering to satisfy Gradle 8's
// implicit-dependency validation.
tasks.matching { it.name == 'spotlessJavaCheck' || it.name == 'spotlessJavaApply' }.configureEach {
    mustRunAfter tasks.named('nodeSetup'), tasks.named('npmInstall')
}

// Disable the jar task so the signing plugin does not produce an
// orphaned .jar.asc (Central Portal rejects deployments that
// reference a .jar file when only a .war exists)
jar.enabled = false

/*
 * TODO:  Groovy-based tests (in src/test/groovy) are not currently run by the Gradle build.
 */

configurations {
    // These get packaged with the war in a special way
    webjars
    // The web components' jar; its META-INF/resources/webcomponents goes to /webcomponents/
    webcomponents
}

// The Groovy/Spock tests compile and run on Groovy 4 (groovyTestVersion), while the war
// keeps the Groovy 3 runtime (groovyVersion) that uPortal-tools and groovy-jsr223 bring in.
// Both declare the org.codehaus.groovy:groovy capability, so align the test classpaths on
// Groovy 4; the runtime classpath (and therefore the war) is untouched.
configurations.matching { it.name.startsWith('test') }.configureEach {
    resolutionStrategy.dependencySubstitution {
        ['groovy', 'groovy-jsr223'].each { name ->
            substitute(module("org.codehaus.groovy:${name}"))
                    .using(module("org.apache.groovy:${name}:${groovyTestVersion}"))
        }
    }
}

dependencies {
    api project(':uPortal-groups:uPortal-groups-filesystem')
    api project(':uPortal-groups:uPortal-groups-grouper')
    api project(':uPortal-groups:uPortal-groups-ldap')
    api project(':uPortal-groups:uPortal-groups-local')
    api project(':uPortal-groups:uPortal-groups-smartldap')
    api project(':uPortal-index')
    api project(':uPortal-portlets')
    api project(':uPortal-security:uPortal-security-authn')
    api project(':uPortal-security:uPortal-security-xslt')
    api project(':uPortal-security:uPortal-security-filters')
    api project(':uPortal-session')
    api project(':uPortal-soffit:uPortal-soffit-connector')
    api project(':uPortal-utils:uPortal-utils-jmx')
    api project(':uPortal-utils:uPortal-utils-url')

    compileOnly "org.apereo.service.persondir:person-directory-api:${personDirectoryVersion}"
    compileOnly "${servletApiDependency}"

    testImplementation "com.tngtech.archunit:archunit-junit4:${archunitVersion}"
    testImplementation project(':uPortal-pluto:uPortal-pluto-container-api')
    testImplementation project(':uPortal-pluto:uPortal-pluto-container-driver-api')
    testImplementation "org.skyscreamer:jsonassert:${jsonassertVersion}"
    testImplementation "org.apache.groovy:groovy-test:${groovyTestVersion}"
    testImplementation "org.spockframework:spock-core:${spockVersion}"
    testImplementation project(':uPortal-pluto:uPortal-pluto-portlet-api')
    testImplementation "${servletApiDependency}"

    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"
    runtimeOnly "org.aspectj:aspectjweaver:${aspectjVersion}"
    runtimeOnly "org.codehaus.groovy:groovy-jsr223:${groovyVersion}"
    runtimeOnly "org.jasig.cas.client:cas-client-support-distributed-ehcache:${casClientVersion}"
    runtimeOnly "org.jasig.ehcache:ehcache-jgroups3replication:${ehcacheJgroups3ReplicationVersion}"
    runtimeOnly "org.jasig.portlet.utils:portlet-ws-util:${apereoPortletUtilsVersion}"
    runtimeOnly "org.apache.logging.log4j:log4j-to-slf4j:${log4j2Version}"
    runtimeOnly "org.slf4j:jul-to-slf4j:${slf4jVersion}"
    runtimeOnly "org.slf4j:log4j-over-slf4j:${slf4jVersion}"
    runtimeOnly "org.springframework.security:spring-security-config:${springSecurityVersion}"
    runtimeOnly "com.thoughtworks.xstream:xstream:${xstreamVersion}"

    /*
     * The HSQL driver jar should always be provided by uPortal-start;
     * that way, it has complete control over the version in the deployment.
     */
    providedRuntime "org.hsqldb:hsqldb:${hsqldbVersion}"

    /*
     * JDBC drivers for running the JPA/DAO tests on other databases (db-integration.yml). The
     * tests use the in-memory HSQLDB unless the uportal.test.db.* system properties are set.
     */
    testRuntimeOnly "com.microsoft.sqlserver:mssql-jdbc:${mssqlJdbcVersion}"
    testRuntimeOnly "com.mysql:mysql-connector-j:${mysqlConnectorJVersion}"
    testRuntimeOnly "com.oracle.database.jdbc:ojdbc11:${ojdbcVersion}"
    testRuntimeOnly "org.mariadb.jdbc:mariadb-java-client:${mariadbJdbcVersion}"
    testRuntimeOnly "org.postgresql:postgresql:${postgresqlJdbcVersion}"

    implementation "org.webjars:webjars-locator-core:0.59"
    
    webjars "org.jasig.resourceserver:resource-server-content:${resourceServerVersion}"
    webjars "org.webjars.npm:bootstrap:${bootstrapVersion}"
    webjars "org.webjars.npm:jstree:${jstreeVersion}"

    webcomponents project(':uPortal-webcomponents')

}

// Pass the database the JPA/DAO tests run on (src/test/resources/dataSource.properties) from
// the Gradle command line to the test JVM, e.g. -Duportal.test.db.url=jdbc:postgresql://...
// Also passes the switches of the migration goldens (uportal.golden.*, MOD-D29) and of the
// ArchUnit freeze store (archunit.*); see MigrationFreezeRulesTest and GoldenFiles.
tasks.withType(Test).configureEach {
    ['driver', 'url', 'username', 'password', 'dialect'].each { String key ->
        String name = "uportal.test.db.${key}"
        String value = providers.systemProperty(name).getOrNull()
        if (value != null) {
            systemProperty name, value
        }
    }
    ['uportal.golden.record',
     'archunit.freeze.store.default.allowStoreUpdate', 'archunit.freeze.store.default.allowStoreCreation',
     'archunit.freeze.refreeze'].each { String name ->
        String value = providers.systemProperty(name).getOrNull()
        if (value != null) {
            systemProperty name, value
        }
    }
    // In GitHub Actions, print the whole message of a failed test in the job log: the golden
    // tests put their diff there, and the test reports cannot always be downloaded
    if (providers.environmentVariable('GITHUB_ACTIONS').isPresent()) {
        testLogging {
            exceptionFormat = 'full'
        }
    }
}

/*
 * Mutation testing of JpaClusterLockDao (MOD-I82, MOD-I99), opt-in and not part of `build`:
 *   ./gradlew :uPortal-webapp:pitest
 * The class is in uPortal-utils-core; its tests are here, on the in-memory HSQLDB. See
 * docs/developer/other/DB_COPY_TOOL_TESTING.md for the score and the threshold.
 */
apply plugin: 'info.solidsoft.pitest'
pitest {
    pitestVersion = project.property('pitestVersion')
    targetClasses = ['org.apereo.portal.concurrency.locking.JpaClusterLockDao*']
    targetTests = ['org.apereo.portal.concurrency.locking.JpaClusterLockDao*']
    // The class's own compiled classes; the jar's path is not known before the jar task has run
    additionalMutableCodePaths.add(project(':uPortal-utils:uPortal-utils-core').layout.buildDirectory
            .dir('classes/java/main').get().asFile)
    threads = 2
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    // The concurrency tests wait for locks; give each mutant room before calling it a timeout
    timeoutConstInMillis = 20000
    // Measured: 39 of 52 mutants killed (75 %); the floor sits a few points lower for mutants that
    // time out on a loaded machine
    mutationThreshold = providers.gradleProperty('pitestThreshold').map { it as int }.getOrElse(70)
    jvmArgs = ['-Xmx1g', '-Djdk.xml.enableExtensionFunctions=true']
}
tasks.named('pitest') {
    dependsOn ':uPortal-utils:uPortal-utils-core:classes'
}

node {
    version = nodejsVersion
    download = true
}

// This project is a workspace of the root npm project (see the root package.json), so npm
// run here acts on the root's package-lock.json and node_modules: `npm install` rewrote the
// lockfile, and `npm ci` would empty the root's node_modules and install only this
// workspace's packages. The root's npmInstall (`npm ci`) installs this workspace's
// dependencies too, so the npm tasks here use that install instead of their own.
tasks.named('npmInstall') {
    enabled = false
    dependsOn ':npmInstall'
}

// Support for filtering properties files
import org.apache.tools.ant.filters.ReplaceTokens
processResources {
    filter(ReplaceTokens, tokens:['projectVersion': project.version, 'plutoVersion': plutoVersion])
}

// Bootstrap path variables
ext.bootstrapJsPath = "${buildDir}/generated-sources/skin/main/webapp/rs"

task prepareSkinResources {
    inputs.files configurations.webjars
    outputs.dir "${buildDir}/generated-sources/skin/main/webapp"
    doLast {
        // Unpack WebJars (part of the skin)
        configurations.webjars.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            String webjarName = artifact.moduleVersion.id.name
            String webjarVersion = artifact.moduleVersion.id.version
            File webjarFile = artifact.file
            // Stage 1:  Exploded WebJar
            copy {
                from zipTree(webjarFile)
                into "${buildDir}/webjars/${webjarName}-${webjarVersion}"
            }
            // Stage 2:  Contents of the WebJar included in the skin
            copy {
                from "${buildDir}/webjars/${webjarName}-${webjarVersion}/META-INF/resources/webjars/${webjarName}/${webjarVersion}"
                into "${buildDir}/generated-sources/skin/main/webapp/webjars/${webjarName}"
            }
            // Stage 3: Copy rs directory from resource-server-content for SCSS compilation
            if (webjarName == 'resource-server-content') {
                copy {
                    from "${buildDir}/webjars/${webjarName}-${webjarVersion}/rs"
                    into "${buildDir}/generated-sources/skin/main/webapp/rs"
                }
            }
        }
        // Add Respondr LESS sources
        copy {
            from 'src/main/webapp/media/skins/respondr'
            into "${buildDir}/generated-sources/skin/main/webapp/media/skins/respondr"
        }
    }
}

import org.jasig.resource.aggr.AggregationRequest
import org.jasig.resource.aggr.ResourcesAggregator
import org.jasig.resource.aggr.ResourcesAggregatorImpl
task aggregateRespondrSkins {
    inputs.files fileTree('src/main/webapp/media/skins/common')
    doLast {
        final ResourcesAggregator aggr = new ResourcesAggregatorImpl();

        final File resourcesXmlFile = new File(projectDir, 'src/main/webapp/media/skins/respondr/defaultSkin/skin.xml');
        final File fullOutputDirectory = new File(buildDir, 'generated-sources/skin/main/webapp/media/skins/respondr/defaultSkin');
        final File sharedJavaScriptDirectory = new File(buildDir, 'generated-sources/skin/main/webapp/media/skins/respondr');

        final AggregationRequest aggregationRequest = new AggregationRequest();
        aggregationRequest
                .setResourcesXml(resourcesXmlFile)
                .setOutputBaseDirectory(fullOutputDirectory)
                .addAdditionalSourceDirectory(fullOutputDirectory)
                .addAdditionalSourceDirectory(new File(projectDir, 'src/main/webapp/media/skins/common'))
                .addAdditionalSourceDirectory(new File(buildDir, 'generated-sources/skin/main/webapp'))
                .addAdditionalSourceDirectory(new File(bootstrapJsPath))
                .setSharedJavaScriptDirectory(sharedJavaScriptDirectory);
        
        aggr.aggregate(aggregationRequest);

    }
}

// Generate CSS for Respondr skins
project.tasks.getByName('npm_run_compile-scss').dependsOn(prepareSkinResources)
aggregateRespondrSkins.dependsOn('npm_run_compile-scss')
processResources.dependsOn(aggregateRespondrSkins)

war {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Gradle 9 makes archives reproducible by default, giving every entry the same fixed
    // date. Keep the real file dates in the war, as before: servlet containers compare JSP
    // and compiled-class dates to decide whether to recompile a JSP, so constant dates could
    // leave stale compiled JSPs in use after a redeploy.
    preserveFileTimestamps = true
    // Add generated CSS for Respondr skins to the war file
    with {
        from "${buildDir}/generated-sources/skin/main/webapp"
        into '/'
    }
    // Add the web components' ES modules and build manifest, served from /webcomponents/
    dependsOn configurations.webcomponents
    from({ configurations.webcomponents.collect { zipTree(it) } }) {
        include 'META-INF/resources/webcomponents/**'
        eachFile { it.path = it.path.substring('META-INF/resources/'.length()) }
        includeEmptyDirs = false
    }
}


// Publish the WAR in place of the disabled jar, with war packaging. The POM dependencies
// still come from components.java (configured in the root build.gradle), as they did
// with the legacy `maven` plugin.
publishing.publications.maven {
    artifacts.clear()
    artifact war
    artifact sourcesJar
    artifact javadocJar
    pom.packaging = 'war'
    // The war plugin's providedRuntime dependencies leak into the java component's
    // variants (compile scope on Gradle 6, runtime on later versions), which would make the
    // container-provided HSQLDB driver a dependency of the war. Keep it out of the POM, as
    // the legacy `maven` plugin did.
    pom.withXml {
        def provided = configurations.providedRuntime.allDependencies.collect { "${it.group}:${it.name}".toString() }
        asNode().dependencies.dependency.findAll {
            "${it.groupId.text()}:${it.artifactId.text()}".toString() in provided
        }.each { it.parent().remove(it) }
    }
}

