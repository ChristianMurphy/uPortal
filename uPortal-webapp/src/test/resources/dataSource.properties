# In-Memory Hypersonic SQL
# This is used for running tests.
#
# The uportal.test.db.* system properties point the JPA/DAO test contexts at another database
# (see .github/workflows/db-integration.yml), e.g.
#   ./gradlew :uPortal-webapp:test -Duportal.test.db.url=jdbc:postgresql://localhost:5432/uportal \
#       -Duportal.test.db.driver=org.postgresql.Driver -Duportal.test.db.username=uportal \
#       -Duportal.test.db.password=uportal
# An empty dialect lets Hibernate pick one from the JDBC metadata, as the portal itself does
# (PortalDialectResolver, then Hibernate's standard resolvers).
hibernate.connection.driver_class=${uportal.test.db.driver:org.hsqldb.jdbcDriver}
hibernate.connection.url=${uportal.test.db.url:jdbc:hsqldb:mem:uPortalTest}
hibernate.connection.username=${uportal.test.db.username:sa}
hibernate.connection.password=${uportal.test.db.password:}
hibernate.dialect=${uportal.test.db.dialect:}
