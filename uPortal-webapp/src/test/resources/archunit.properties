# Freeze store of MigrationFreezeRulesTest (MOD-D29): the recorded uses of APIs the
# modernization removes. Any new use fails; a removed use fails until the store is updated
# with -Darchunit.freeze.store.default.allowStoreUpdate=true (see the test's javadoc).
# The path is relative to the test JVM's working directory, the uPortal-webapp project.
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false

# Read only the classes being checked: the rules match the types they look for by name, so
# ArchUnit need not import every referenced third-party class (which made the test take minutes).
resolveMissingDependenciesFromClassPath=false
