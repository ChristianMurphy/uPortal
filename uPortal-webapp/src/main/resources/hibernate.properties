#
# Freeze block: keep the schema and the generated ids of existing databases exactly as
# Hibernate 4.3 (uPortal 5.17) created them. These settings apply to all three persistence units.
# Each one stays until a migration deliberately changes what it protects. The golden files of
# PersistenceUnitDdlTest and the DB upgrade harness in uPortal-start check them.
#
# The dialect decides column types and whether ids are backed by sequences or one-row tables.
# PortalDialectResolver picks uPortal's dialects and otherwise the one Hibernate 4.3 picked.
hibernate.dialect_resolvers=org.apereo.portal.utils.PortalDialectResolver
# Table, column and join column names as Hibernate 4.3's EJB3NamingStrategy derived them
# (legacy-jpa; the Hibernate 5 default would name the join column of UP_EVENT_SESSION_GROUPS
# EventSessionImpl_ID instead of UP_EVENT_SESSION_ID), plus Hibernate 4.3's FK_/UK_ hashes for
# foreign key and unique key names, which legacy-jpa alone does not reproduce.
hibernate.implicit_naming_strategy=org.apereo.portal.hibernate.PortalImplicitNamingStrategy
# Logical names are the physical names, as in Hibernate 4.3 (also the Hibernate 5 default).
hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Sequences and one-row tables hand out ids through the pooled optimizer, Hibernate 4.3's
# default. The database object holds the high end of the last block; another optimizer would
# read it differently and could issue ids twice.
hibernate.id.optimizer.pooled.preferred=pooled
# From Hibernate 5.4: refuse to start when a database sequence's increment differs from the
# mapping's allocationSize, instead of issuing colliding ids. Every uPortal sequence's
# increment equals its allocationSize (MOD-I23). Hibernate 5.2 ignores this setting.
hibernate.id.sequence.increment_size_mismatch_strategy=EXCEPTION
#
# Not part of the freeze block: java.util.Date, Timestamp and Instant columns hold UTC clock time
# (MOD-I141). 5.17 stored the JVM's local clock time in these columns. Jadira's Joda-Time types
# bind with their own zones (global.hbm.xml), so this setting leaves them alone.
hibernate.jdbc.time_zone=UTC
