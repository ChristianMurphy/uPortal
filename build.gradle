buildscript {
    // The nebula.lint plugin pulls commons-lang3:3.8.1 transitively (via
    // maven-artifact) onto the plugin classpath, which is a parent of every
    // subproject buildscript classloader. Parent-first class loading means
    // that 3.8.1 shadows the newer commons-lang3 declared on subproject
    // buildscript classpaths (e.g. the resource aggregator used by
    // uPortal-webapp:aggregateRespondrSkins). 3.8.1 predates
    // StringUtils.getIfEmpty (added in lang3 3.10), which commons-compress
    // 1.28+ calls, so force a modern lang3 on the plugin classpath.
    configurations.classpath {
        resolutionStrategy {
            force "org.apache.commons:commons-lang3:${commonsLang3Version}"
        }
    }
}

plugins {
    // Top level plugins
    id 'com.github.node-gradle.node' version '7.1.0'
    id 'net.researchgate.release' version '3.2.0'
    // Records all tasks in task graph, generates `build/reports/visteg.dot`
    // dot file can be converted to an image using graphviz. `dot -Tsvg -O -v visteg.dot`
    // id 'cz.malohlava.visteg' version '1.0.5'

    // Sub project plugins
    id 'com.diffplug.spotless' version '8.10.4' apply false
    id 'nebula.lint' version '21.3.0' apply false
    id 'net.ltgt.errorprone' version '5.1.1' apply false
    id 'com.github.spotbugs' version '6.5.12' apply false
    // uPortal-db-migrate only: a standalone Spring Boot CLI with its own dependency platform
    // (the plugin's BOM), independent of the portal's Spring 4.3 stack
    id 'org.springframework.boot' version '4.1.1' apply false
}

description = "Apereo uPortal $version"

/*======== Dependency Management ========**/
repositories {
    mavenCentral()
    mavenLocal()
}

node {
    version = nodejsVersion
    download = true
    // Install exactly what package-lock.json pins and never rewrite it
    npmInstallCommand = 'ci'
}

/**
 * Collects the result of every Test task and prints a per-module summary when the build
 * finishes (Gradle closes build services at the end of the build).
 */
abstract class TestSummaryService implements BuildService<org.gradle.api.services.BuildServiceParameters.None>, AutoCloseable {
    private final List<Map> summaries = Collections.synchronizedList([])

    void add(Map summary) {
        summaries << summary
    }

    @Override
    void close() {
        if (summaries.isEmpty()) {
            return
        }
        def failed = summaries.any { it.failed > 0 || it.resultType.toString() == 'FAILURE' }
        println "=== All Module Test Summaries (${failed ? 'TEST FAILURE' : 'TEST SUCCESS'}) ==="
        summaries.sort { it.projectPath }.each { s ->
            println "Module ${s.projectPath} (${s.taskPath}): ${s.resultType} - ${s.executed} executed, ${s.passed} passed, ${s.failed} failed, ${s.skipped} skipped in ${s.durationMs} ms"
        }
        def total = summaries.inject([e:0,p:0,f:0,s:0,d:0]) { acc, m ->
            acc.e += m.executed; acc.p += m.passed; acc.f += m.failed; acc.s += m.skipped; acc.d += m.durationMs; acc
        }
        println "=== Aggregate Test Summary: ${total.e} executed, ${total.p} passed, ${total.f} failed, ${total.s} skipped (sum durations ${total.d} ms) ==="
    }
}
def testSummaryService = gradle.sharedServices.registerIfAbsent('testSummary', TestSummaryService) {}

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'jacoco'
    apply plugin: 'eclipse'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'idea'
    apply plugin: 'nebula.lint'
    apply plugin: 'groovy'
    apply plugin: 'codenarc'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'net.ltgt.errorprone'

    // Banned dependencies. configureEach (rather than all*.exclude, which only reaches the
    // configurations that exist at this point) also covers configurations that Gradle 9
    // creates lazily, such as compileClasspath.
    configurations.configureEach {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'commons-logging', module: 'commons-logging-api'
        exclude group: 'log4j', module: 'log4j'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-core'
        exclude group: 'org.hamcrest', module: 'hamcrest-core'
    }

    dependencies {
        errorprone "com.google.errorprone:error_prone_core:${errorproneVersion}"
    }

    jacoco {
        // JaCoCo 0.8.14+ supports Java 25 runtimes (class file version 69)
        toolVersion = jacocoVersion
    }

    codenarc {
        toolVersion = codenarcVersion
        reportFormat = 'console'
    }
    tasks.withType(CodeNarc).configureEach {
        // Gradle 9 hands CodeNarc the compile classpath by default, which switches on its
        // "enhanced" rules (they were skipped before). Keep the previous rule set here; the
        // enhanced rules currently flag AnyUnblockedGrantPermissionPolicyTest
        // (JUnitAssertEqualsConstantActualValue) and can be enabled separately.
        compilationClasspath = files()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_11
    }
    // Compile against the Java 11 platform API and emit Java 11 bytecode whichever JDK runs
    // the build (javac --release), so building with a newer JDK cannot leak Java 12+
    // language features or APIs into the published classes.
    tasks.withType(JavaCompile).configureEach {
        options.release = 11
    }
    tasks.withType(GroovyCompile).configureEach {
        options.release = 11
    }
    // Record method parameter names in the class files (javac -parameters). Spring 6.1+ no
    // longer reads them from debug info, and needs them for name-based
    // <constructor-arg name="..."> wiring and implicit @RequestParam/@PathVariable names.
    // Spring 4.3 already prefers these names when present and otherwise reads the same
    // names from the debug info, so its behaviour does not change.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-parameters')
    }
    tasks.withType(JavaCompile).configureEach {
        options.errorprone {
            // ERROR-level checks added to Error Prone after 2.3.4 that flag existing code.
            // Disabled so the toolchain upgrade needs no production change; each finding
            // should be fixed (and its check re-enabled) separately.
            disable('BanJNDI', 'BoxedPrimitiveEquality', 'DoubleBraceInitialization', 'SelfAssertion')
        }
    }

    // 'duplicate-dependency-class' was dropped with Gradle 9: it resolves every project's
    // configurations from the root lint task, which Gradle 9 rejects as unsafe
    // cross-project resolution.
    gradleLint.criticalRules = [
      'overridden-dependency-version',
      'dependency-parentheses',
      'dependency-tuple',
      'empty-closure'
    ]

    /*======== Static Analysis ========*/
    // SpotBugs + FindSecBugs as a ratchet (MOD-D27): `./gradlew spotbugsMain` fails on any
    // finding that is not in the module's committed baseline,
    // config/spotbugs/baseline/<module>.xml. `build` and `check` leave SpotBugs out (it is
    // slow at effort max); CI runs it in its own job. `./gradlew spotbugsBaseline` rewrites the
    // baselines; see docs/developer/other/STATIC_ANALYSIS.md.
    spotbugs {
        toolVersion = spotbugsVersion
        effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf('MEDIUM')
        includeFilter = rootProject.file('config/spotbugs/include.xml')
        runOnCheck = false
    }
    def spotbugsBaselineFile = rootProject.file("config/spotbugs/baseline/${project.name}.xml")
    def rewritingSpotbugsBaseline = gradle.startParameter.taskNames.any {
        it == 'spotbugsBaseline' || it.endsWith(':spotbugsBaseline')
    }
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html {
                required = true
                stylesheet = 'fancy-hist.xsl'
            }
            xml {
                required = true
            }
            text {
                required = true
            }
        }
    }
    tasks.named('spotbugsMain', com.github.spotbugs.snom.SpotBugsTask) {
        if (rewritingSpotbugsBaseline) {
            // Record every current finding
            ignoreFailures = true
        } else if (spotbugsBaselineFile.exists()) {
            excludeFilter = spotbugsBaselineFile
        }
    }
    tasks.register('spotbugsBaseline', SpotBugsBaselineTask) {
        group = 'verification'
        description = "Rewrites config/spotbugs/baseline/${project.name}.xml from the current SpotBugs findings."
        def spotbugsMain = tasks.named('spotbugsMain', com.github.spotbugs.snom.SpotBugsTask)
        dependsOn spotbugsMain
        report = spotbugsMain.flatMap { it.reports.getByName('xml').outputLocation }
        baselineApplied = spotbugsMain.flatMap { it.excludeFilter.map { true } }.orElse(false)
        baselineFile = spotbugsBaselineFile
    }
    spotless {
        java {
            googleJavaFormat(googleJavaFormatVersion).aosp()
            targetExclude '**/generated-sources/**', '**/build/**'
        }
    }
    // Keep the task names of the previous google-java-format plugin working, and with
    // them the documented abbreviations `./gradlew verGJF` and `./gradlew goJF`.
    tasks.register('verifyGoogleJavaFormat') {
        group = 'verification'
        description = 'Alias for spotlessJavaCheck (formerly provided by the sherter google-java-format plugin).'
        dependsOn 'spotlessJavaCheck'
    }
    tasks.register('googleJavaFormat') {
        group = 'formatting'
        description = 'Alias for spotlessJavaApply (formerly provided by the sherter google-java-format plugin).'
        dependsOn 'spotlessJavaApply'
    }
    // The root spotlessJavaCheck scans the project tree which overlaps with the
    // webapp's nodeSetup/npmInstall output directory.  Order the root task to run
    // after the webapp's node setup to satisfy Gradle 8's implicit-dependency
    // validation.
    if (project == rootProject) {
        tasks.matching { it.name == 'spotlessJavaCheck' || it.name == 'spotlessJavaApply' }.configureEach {
            mustRunAfter ':uPortal-webapp:nodeSetup', ':uPortal-webapp:npmInstall'
        }
    }

    /*======== Aggregate Dependencies Report ========*/
    task dependenciesRecursive(type: DependencyReportTask) {
        group = 'Help'
        description = 'Provides a complete report on project dependencies;  use option (e.g.) --configuration compile to narrow'
    }

    tasks.withType(Test).configureEach { testTask ->
        usesService(testSummaryService)
        def projectPath = project.path
        def taskPath = testTask.path
        addTestListener(new TestListener() {
            void beforeSuite(TestDescriptor suite) {}
            void beforeTest(TestDescriptor test) {}
            void afterTest(TestDescriptor test, TestResult result) {}
            void afterSuite(TestDescriptor suite, TestResult result) {
                if (!suite.parent) {
                    // Store summary; it is printed when the build finishes
                    testSummaryService.get().add([
                            projectPath: projectPath,
                            taskPath   : taskPath,
                            resultType : result.resultType,
                            executed   : result.testCount,
                            passed     : result.successfulTestCount,
                            failed     : result.failedTestCount,
                            skipped    : result.skippedTestCount,
                            durationMs : (result.endTime - result.startTime)
                    ])
                }
            }
        })
    }
}

/** Passes a Java agent jar to a forked JVM, tracking the jar as a task input. */
class JavaAgentArgumentProvider implements CommandLineArgumentProvider {
    @Classpath
    final FileCollection agent

    JavaAgentArgumentProvider(FileCollection agent) {
        this.agent = agent
    }

    @Override
    Iterable<String> asArguments() {
        ["-javaagent:${agent.singleFile.absolutePath}".toString()]
    }
}

/**
 * Writes a SpotBugs exclude filter that matches every finding in a module's SpotBugs XML report.
 * Applied to spotbugsMain, it makes SpotBugs fail only on findings that are new (MOD-D27).
 * Entries match on class, method (or field) and bug pattern. Numbers of anonymous classes and
 * lambdas become wildcards, so adding a lambda or anonymous class doesn't break the baseline.
 */
abstract class SpotBugsBaselineTask extends DefaultTask {
    /** The XML report of a spotbugsMain run without the baseline (absent for a module without classes). */
    @Internal
    abstract RegularFileProperty getReport()

    /** Whether spotbugsMain ran with the baseline applied, so its report holds only new findings. */
    @Internal
    abstract Property<Boolean> getBaselineApplied()

    @Internal
    abstract RegularFileProperty getBaselineFile()

    SpotBugsBaselineTask() {
        outputs.upToDateWhen { false }
    }

    /** Escapes a class or member name for a filter, as a regex when it holds a compiler-assigned number. */
    static String filterName(String name) {
        if (!name.matches('.*[$][0-9].*')) {
            return groovy.xml.XmlUtil.escapeXml(name)
        }
        def regex = new StringBuilder('~')
        int i = 0
        while (i < name.length()) {
            char c = name.charAt(i)
            if (c == ('$' as char) && i + 1 < name.length() && Character.isDigit(name.charAt(i + 1))) {
                regex << '\\$\\d+'
                i++
                while (i < name.length() && Character.isDigit(name.charAt(i))) {
                    i++
                }
                continue
            }
            if (c == ('.' as char) || c == ('$' as char)) {
                regex << '\\'
            }
            regex << c
            i++
        }
        return groovy.xml.XmlUtil.escapeXml(regex.toString())
    }

    @TaskAction
    void write() {
        if (baselineApplied.get()) {
            throw new GradleException('spotbugsMain ran with the baseline applied. Run the task by its full name: ./gradlew spotbugsBaseline')
        }
        def reportFile = report.get().asFile
        def out = baselineFile.get().asFile
        def entries = new TreeSet<String>()
        if (reportFile.exists()) {
            def collection = new groovy.xml.XmlSlurper().parse(reportFile)
            collection.BugInstance.each { bug ->
                def primary = { kind -> bug."$kind".find { it.@primary == 'true' } ?: bug."$kind"[0] }
                def cls = primary('Class')
                def method = primary('Method')
                def field = primary('Field')
                def entry = new StringBuilder("<Match><Class name=\"${filterName(cls.@classname.text())}\"/>")
                if (!method.isEmpty()) {
                    entry << "<Method name=\"${filterName(method.@name.text())}\"/>"
                } else if (!field.isEmpty()) {
                    entry << "<Field name=\"${filterName(field.@name.text())}\"/>"
                }
                entry << "<Bug pattern=\"${bug.@type}\"/></Match>"
                entries << entry.toString()
            }
        }
        if (entries.isEmpty()) {
            if (out.delete()) {
                logger.lifecycle("No SpotBugs findings; deleted ${out}")
            }
            return
        }
        out.parentFile.mkdirs()
        out.text = """<?xml version="1.0" encoding="UTF-8"?>
<!--
  SpotBugs baseline for ${project.name}: findings that predate the SpotBugs ratchet (MOD-D27).
  spotbugsMain ignores these and fails on anything else. Generated by
  `./gradlew ${project.path == ':' ? '' : project.path}:spotbugsBaseline`; don't add entries by hand.
  Shrink it by fixing findings and rerunning that task (or deleting their entries).
-->
<FindBugsFilter>
${entries.collect { '    ' + it }.join('\n')}
</FindBugsFilter>
"""
        logger.lifecycle("Wrote ${entries.size()} SpotBugs baseline entries to ${out}")
    }
}

/*======== Child Projects ========*/
subprojects {

    /*======== Plugins ========*/
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    /*======== Dependency Management ========**/
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://jitpack.io" }
    }

    configurations {
        mockitoAgent
    }

    dependencies {
        testImplementation "junit:junit:${junitVersion}"
        testImplementation "org.easymock:easymock:${easymockVersion}"
        testImplementation "org.hamcrest:hamcrest-all:${hamcrestVersion}"
        testImplementation "org.mockito:mockito-core:${mockitoVersion}"
        testImplementation "org.springframework:spring-test:${springVersion}"
        testImplementation "org.xmlunit:xmlunit-legacy:${xmlunitVersion}"
        spotbugsPlugins "com.h3xstream.findsecbugs:findsecbugs-plugin:${findsecbugsVersion}"
        mockitoAgent("org.mockito:mockito-core:${mockitoVersion}") {
            transitive = false
        }
    }

    tasks.withType(Test).configureEach {
        // Mockito 5's inline mock maker otherwise self-attaches as a Java agent at runtime,
        // which JDK 21+ warns about and a future JDK will refuse (JEP 451). Load it explicitly.
        jvmArgumentProviders.add(new JavaAgentArgumentProvider(configurations.mockitoAgent))
        // Since JDK 24 the default conf/jaxp.properties sets jdk.xml.enableExtensionFunctions=false,
        // but uPortal's XSLT (rendering pipeline, Xalan helpers, import upgrades) calls Java
        // extension functions. A portal running on JDK 24+ needs this flag too; on JDK 21 it is
        // already the default.
        systemProperty 'jdk.xml.enableExtensionFunctions', 'true'
    }

    /* Release Management
     *
     * Based on Sonatype's guide for publishing w/ Gradle:  https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/
     *
     * OSSRH was sunset June 2025. Publishing now goes through the Central Portal's
     * OSSRH Staging API compatibility service. Credentials must be Central Portal
     * user tokens (generate at https://central.sonatype.com).
     */
    ext {
        publishingUsername = project.hasProperty('ossrhUsername') ? project.getProperty('ossrhUsername') : ""
        publishingPassword = project.hasProperty('ossrhPassword') ? project.getProperty('ossrhPassword') : ""
        publishingRepositoryUrl = project.hasProperty('ossrhUrl') ? project.getProperty('ossrhUrl') : "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
        publishingRepositoryUrlSnapshot = project.hasProperty('ossrhUrlSnapshot') ? project.getProperty('ossrhUrlSnapshot') : "https://central.sonatype.com/repository/maven-snapshots/"
    }
    tasks.withType(Javadoc).all {
        // disable JavaDocs until we start using them again in our website
        enabled = false
    }
    tasks.withType(Jar) {
        from(project.projectDir) {
            include "${rootDir}/LICENSE"
            into 'META-INF'
        }
    }
    task sourcesJar(type: Jar, dependsOn: classes) {
        archiveClassifier.set('sources')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from sourceSets.main.allSource
    }
    task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier.set('javadoc')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from javadoc.destinationDir
    }
    publishing {
        publications {
            maven(MavenPublication) {
                // uPortal-webapp swaps the jar for its war in its own build script
                from components.java
                artifact sourcesJar
                artifact javadocJar
                pom {
                    name = 'uPortal'
                    description = 'Enterprise open source portal built by and for the higher education community.'
                    url = 'https://github.com/uPortal-Project/uPortal'
                    scm {
                        connection = 'scm:git@github.com:uPortal-Project/uPortal.git'
                        url = 'https://github.com/uPortal-Project/uPortal'
                    }
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            organization = 'uPortal Developers'
                            organizationUrl = 'https://github.com/uPortal-Project/uPortal/graphs/contributors'
                        }
                    }
                }
            }
        }
        repositories {
            maven {
                // Releases go to the OSSRH Staging API, snapshots to the Central Portal
                // snapshot repository (the same split the legacy mavenDeployer made).
                url = version.toString().endsWith('SNAPSHOT') ? publishingRepositoryUrlSnapshot : publishingRepositoryUrl
                credentials {
                    username = publishingUsername
                    password = publishingPassword
                }
            }
        }
    }
    // Publish exactly what the legacy `maven` plugin published (POM + jar/war + sources +
    // javadoc + signatures). Gradle Module Metadata (.module) would change how Gradle
    // consumers such as uPortal-start resolve these artifacts; leave that for a separate change.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }
    // True only when artifacts are being uploaded to a remote repository (a release).
    def isPublishingToRemote = {
        gradle.taskGraph.allTasks.any { it instanceof PublishToMavenRepository }
    }
    signing {
        // Sign via the gpg command + gpg-agent (like the Maven ecosystem components),
        // rather than reading an in-process secring.gpg. gpg-agent supplies the
        // passphrase (pinentry), so no signing.password is stored in a properties file,
        // and the modern GnuPG keystore is used. Select the key with the
        // `signing.gnupg.keyName` Gradle property (e.g. in ~/.gradle/gradle.properties).
        useGpgCmd()
        required = { isPublishingToRemote() }
        sign publishing.publications.maven
    }
    // `useGpgCmd()` makes the gpg command an always-present signatory, so the Sign
    // tasks would otherwise run on CI (gpg is installed) with no key and fail. `required`
    // only governs enforcement, not execution — gate the tasks themselves so they run
    // only when a release is actually uploading artifacts.
    tasks.withType(Sign).configureEach {
        onlyIf { isPublishingToRemote() }
    }
    // Backward-compatible alias: `./gradlew install` (used by uPortal-start's docs and
    // release-uportal.sh) keeps publishing to the local Maven repository.
    task install {
        group = 'publishing'
        description = 'Alias for publishToMavenLocal (backward compatibility)'
        dependsOn publishToMavenLocal
    }

    def jacocoExecutionDataFiles = fileTree(buildDir).include("/jacoco/*.exec")
    jacocoTestReport {
        getExecutionData().setFrom(jacocoExecutionDataFiles)
    }
}

/*
 * Configuration for the 'gradle-release' plugin (https://github.com/researchgate/gradle-release)
 */
release {
    tagTemplate = 'v${version}' // Looks like it should be a GString, but not necessary
    git {
        requireBranch.set('')
    }
}
afterReleaseBuild.dependsOn subprojects.collect { "${it.path}:publish" }


task jacocoAggregateReport(type: org.gradle.testing.jacoco.tasks.JacocoReport) {
    dependsOn = subprojects.test
    getAdditionalSourceDirs().setFrom(files(subprojects.sourceSets.main.allSource.srcDirs))
    getSourceDirectories().setFrom(files(subprojects.sourceSets.main.allSource.srcDirs))
    getClassDirectories().setFrom(files(subprojects.sourceSets.main.output))
    // Use a filtered file tree that lazily excludes non-existent files
    getExecutionData().setFrom(files(subprojects.collect {
        fileTree(dir: "${it.buildDir}/jacoco", include: '*.exec')
    }))

    reports {
        xml.required = true
        html.required = true
    }
    onlyIf = {
        true
    }
}

/**
 * CRAP Score Analysis Task
 * ========================
 * Add this to the end of your root build.gradle file
 * 
 * Calculates CRAP (Change Risk Anti-Patterns) score for all methods
 * CRAP = complexity² × (1 - coverage)³ + complexity
 * 
 * Methods with CRAP > 30 are considered high-risk and should be:
 *   - Tested thoroughly before modification, OR
 *   - Refactored to reduce complexity first
 * 
 * Usage: ./gradlew crapAnalysis
 * Output: build/reports/crap-analysis/
 */

task crapAnalysis {
    group = 'verification'
    description = 'Analyzes code coverage gaps using CRAP score to prioritize testing efforts'
    dependsOn jacocoAggregateReport
    
    doLast {
        def jacocoXml = file("${buildDir}/reports/jacoco/jacocoAggregateReport/jacocoAggregateReport.xml")
        
        if (!jacocoXml.exists()) {
            throw new GradleException("JaCoCo report not found. Run 'jacocoAggregateReport' first.")
        }
        
        def outputDir = file("${buildDir}/reports/crap-analysis")
        outputDir.mkdirs()
        
        println "Parsing JaCoCo report: ${jacocoXml}"

        // Load the Jacoco XML as text and remove any DOCTYPE to avoid parser restrictions
        def xmlText = jacocoXml.getText('UTF-8')
        xmlText = xmlText.replaceAll(/(?s)<!DOCTYPE.*?>/, '')
        def report = new groovy.xml.XmlSlurper(false, false).parseText(xmlText)
        def methods = []
        def packageStats = [:]
        
        // Parse JaCoCo XML structure
        report.package.each { pkg ->
            def packageName = pkg.@name.text().replace('/', '.')
            
            if (!packageStats[packageName]) {
                packageStats[packageName] = [
                    name: packageName,
                    totalComplexity: 0,
                    coveredComplexity: 0,
                    methodCount: 0,
                    uncoveredMethods: 0,
                    files: [] as Set
                ]
            }
            
            pkg.sourcefile.each { srcFile ->
                def fileName = srcFile.@name.text()
                packageStats[packageName].files.add(fileName)
                
                def className = fileName.replaceAll('\\.java$', '').replaceAll('\\.groovy$', '')
                
                srcFile.line.each { line ->
                    def lineNum = line.@nr.text()
                    def missedInstructions = (line.@mi.text() ?: '0') as int
                    def coveredInstructions = (line.@ci.text() ?: '0') as int
                    def missedBranches = (line.@mb.text() ?: '0') as int
                    def coveredBranches = (line.@cb.text() ?: '0') as int
                    
                    // Estimate complexity from branches (rough approximation)
                    def totalBranches = missedBranches + coveredBranches
                    if (totalBranches > 0) {
                        def complexity = totalBranches + 1
                        def totalInstructions = missedInstructions + coveredInstructions
                        def coverage = totalInstructions > 0 ? (coveredInstructions / totalInstructions) : 0.0
                        def crapScore = calculateCrap(complexity, coverage)
                        
                        methods.add([
                            package: packageName,
                            class: className,
                            line: lineNum,
                            complexity: complexity,
                            coverage: coverage * 100,
                            coveredBranches: coveredBranches,
                            missedBranches: missedBranches,
                            crapScore: crapScore
                        ])
                        
                        packageStats[packageName].totalComplexity += complexity
                        packageStats[packageName].coveredComplexity += complexity * coverage
                        packageStats[packageName].methodCount++
                        if (coverage < 0.5) {
                            packageStats[packageName].uncoveredMethods++
                        }
                    }
                }
            }
        }
        
        // Sort by CRAP score (highest first)
        methods.sort { -it.crapScore }
        
        // Generate reports
        generateHtmlReport(methods, packageStats, outputDir)
        generateCsvReport(methods, outputDir)
        
        // Print summary
        printSummary(methods, packageStats, outputDir)
    }
}

def calculateCrap(int complexity, double coverage) {
    // CRAP = complexity² × (1 - coverage)³ + complexity
    def uncoverage = 1.0 - coverage
    return (complexity * complexity * Math.pow(uncoverage, 3)) + complexity
}

def printSummary(methods, packageStats, outputDir) {
    println "\n" + "=".multiply(80)
    println "CRAP ANALYSIS SUMMARY"
    println "=".multiply(80)
    println "Total decision points analyzed: ${methods.size()}"
    println "High-risk (CRAP > 30): ${methods.count { it.crapScore > 30 }}"
    println "Medium-risk (CRAP 10-30): ${methods.count { it.crapScore > 10 && it.crapScore <= 30 }}"
    println "Low-risk (CRAP < 10): ${methods.count { it.crapScore <= 10 }}"
    
    println "\n📊 Top 10 highest CRAP scores:"
    methods.take(10).eachWithIndex { m, idx ->
        println sprintf("  %2d. CRAP: %6.1f | Complexity: %3d | Coverage: %5.1f%% | %s.%s:%s",
            idx + 1, m.crapScore, m.complexity, m.coverage, m.package, m.class, m.line)
    }
    
    println "\n📦 Packages with most untested complexity:"
    packageStats.values()
        .sort { -(it.totalComplexity - it.coveredComplexity) }
        .take(5).eachWithIndex { pkg, idx ->
            def uncoveredComplexity = pkg.totalComplexity - pkg.coveredComplexity
            def uncoveredComplexityInt = (uncoveredComplexity as int)
            def coveragePercent = pkg.totalComplexity > 0 ?
                (pkg.coveredComplexity / (pkg.totalComplexity as double) * 100.0) : 0.0
            println sprintf("  %d. %s", idx + 1, pkg.name)
            println sprintf("     Uncovered complexity: %d points (%.1f%% coverage, %d decision points)",
                uncoveredComplexityInt, coveragePercent, pkg.methodCount)
        }
    
    println "\n📄 Reports generated:"
    println "  HTML: ${outputDir}/crap-report.html"
    println "  CSV:  ${outputDir}/crap-report.csv"
    println "\n💡 Next steps:"
    println "  1. Open the HTML report in your browser"
    println "  2. Focus on methods with CRAP > 30 (high-risk)"
    println "  3. Either add tests OR refactor to reduce complexity"
    println "=".multiply(80) + "\n"
}

def generateCsvReport(methods, outputDir) {
    def csvFile = new File(outputDir, "crap-report.csv")
    
    csvFile.withWriter { writer ->
        writer.writeLine("Rank,CRAP Score,Complexity,Coverage %,Covered Branches,Missed Branches,Package,Class,Line")
        methods.eachWithIndex { m, idx ->
            writer.writeLine("${idx + 1},${String.format('%.2f', m.crapScore)},${m.complexity},${String.format('%.1f', m.coverage)},${m.coveredBranches},${m.missedBranches},\"${m.package}\",\"${m.class}\",${m.line}")
        }
    }
}

